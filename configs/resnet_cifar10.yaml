seed: 42
experiment: resnet18_cifar100
output_dir: runs

data:
  root: ../../data      # relative to this file; must contain the cifar-100-python folder
  val_size: 5000
  batch_size: 128
  num_workers: 4
  augment: trivial      # none | basic | trivial
  random_erasing: 0.25
  mixup_alpha: 0.0      # 0 disables MixUp/CutMix

model:
  name: resnet18
  num_classes: 100
  dropout: 0.2

train:
  epochs: 100
  optimizer: sgd        # sgd (lr ~0.1) | adamw (lr ~0.003)
  lr: 0.1
  momentum: 0.9
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  grad_clip: 2.0
  amp: true
  early_stop_patience: 25
  compile: false        
