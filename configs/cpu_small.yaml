# CPU-friendly settings: ResNet-small (0.31M params), ~88-90% test accuracy.
# Run: python -m cifar_cnn.train --config configs/cpu_small.yaml
seed: 42
experiment: resnet_small_cpu
output_dir: runs

data:
  root: ../../data      # relative to this file -> dee_transformer_ml/data (existing CIFAR-10)
  val_size: 5000
  batch_size: 128
  num_workers: 4
  augment: trivial      # none | basic | trivial
  random_erasing: 0.25
  mixup_alpha: 0.0      # 0 disables MixUp/CutMix

model:
  name: resnet_small
  num_classes: 10
  dropout: 0.1

train:
  epochs: 30
  optimizer: sgd        # sgd (lr ~0.1) | adamw (lr ~0.003)
  lr: 0.1
  momentum: 0.9
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  grad_clip: 2.0
  amp: false            # mixed precision only helps on a GPU
  early_stop_patience: 10
  compile: false
